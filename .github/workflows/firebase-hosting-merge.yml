# CI only. Production publication requires the owner's final manual release window.
name: Build and test on merge — no deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            crm/package-lock.json
            functions/package-lock.json
      - run: npm ci --prefix crm
      - run: npm ci --prefix functions
      - run: node scripts/check-ci-no-deploy.cjs
      - run: node --test scripts/check-ci-no-deploy.test.cjs
      - run: node scripts/sync-point-schedule.cjs --check
      - run: node scripts/sync-canonical-auth.cjs --check
      - run: node scripts/sync-fiscal-money.cjs --check
      - run: npm test --prefix functions
      - run: npm test --prefix crm -- --watchAll=false --runInBand
        env:
          CI: 'true'
      - run: node node_modules/react-scripts/bin/react-scripts.js build
        working-directory: crm
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
